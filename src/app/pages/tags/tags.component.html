<div class="tags-page">
	<h1 class="tags-page__title" translate>Теги</h1>

	<p-table [value]="tagsService.tags()">
		<ng-template #header>
			<tr>
				<th translate>Назва</th>
				<th translate>Приклад</th>
			</tr>
		</ng-template>

		<ng-template #body let-tag>
			<tr>
				<td>{{ tag.name }}</td>
				<td><p-tag [value]="tag.name" [severity]="tag.severity" /></td>
			</tr>
		</ng-template>
	</p-table>
</div>
