<div class="jobs-page">
	<h1 class="jobs-page__title" translate>Джоби</h1>

	<p class="jobs-page__subtitle" translate>
		Розділ фріланс-завдань і гіг-проєктів. Тут з’являться пропозиції робіт від
		команд, які вже ведуть свої проєкти в ToDo.
	</p>

	<div class="jobs-page__grid">
		@for (job of jobs; track job.title) {
			<p-card [header]="job.title" [subheader]="job.budget">
				<p class="m-0 text-sm text-[var(--c-text-muted)]">{{ job.description }}</p>

				<div class="mt-3 flex flex-wrap gap-2">
					@for (tag of job.tags; track tag) {
						<p-tag [value]="tag" severity="secondary" />
					}
				</div>
			</p-card>
		} @empty {
			<p class="jobs-page__empty" translate>Поки що немає доступних завдань</p>
		}
	</div>
</div>
