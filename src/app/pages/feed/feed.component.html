<div class="feed">
	<h1 class="feed__title" translate>Стрічка</h1>

	<div class="feed__list">
		@for (task of tasks(); track task._id) {
			<div class="feed__item">
				<span class="feed__project">{{ projectName(task.projectId) }}</span>
				<app-task-short [task]="task" />
			</div>
		} @empty {
			<p class="feed__empty" translate>Немає активних задач</p>
		}
	</div>
</div>
